{% extends 'layout/base.html' %}

{% block content %}
<div class="container mt-5">

    <h2
        class="mb-3"
        style="
            color:#1a3c5e;
            font-weight:600;
        "
    >
        Quên mật khẩu
    </h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            <div
    role="alert"
    style="
        padding:12px;
        border-radius:8px;
        margin-bottom:16px;

        {% if category == 'success' %}
            background:#d1e7dd;
            color:#0f5132;
            border:1px solid #badbcc;
        {% elif category == 'danger' %}
            background:#f8d7da;
            color:#842029;
            border:1px solid #f5c2c7;
        {% else %}
            background:#cff4fc;
            color:#055160;
            border:1px solid #b6effb;
        {% endif %}
    "
>
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}
{% endwith %}

    <form
        method="POST"
        class="mt-4"
    >

        <div class="mb-3">

            <label
                for="email"
                class="form-label"
            >
                Email
            </label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
            >

        </div>

        <div class="mb-3">

            <label
                for="password"
                class="form-label"
            >
                Mật khẩu mới
            </label>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
            >

        </div>

        <div class="mb-3">

            <label
                for="confirm_password"
                class="form-label"
            >
                Xác nhận mật khẩu
            </label>

            <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Đổi mật khẩu
        </button>

    </form>

    <div class="mt-3 text-center">

        <a
            href="{{ url_for('auth.login') }}"
            class="btn btn-link"
        >
            Quay lại đăng nhập
        </a>

    </div>

</div>
{% endblock %}
