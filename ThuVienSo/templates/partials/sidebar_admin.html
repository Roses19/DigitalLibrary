{% set role_name = current_user.role.name|lower if current_user and current_user.role else '' %}
{% set is_admin = role_name in ['admin', 'quản trị', 'quan tri', 'quản trị viên', 'quan tri vien'] %}

<aside class="admin-sidebar">

    <button type="button"
            class="admin-sidebar-link {% if active_tab|default('users') == 'books' %}active{% endif %}"
            onclick="window.location.href='/admin?tab=books'">
        <span class="sidebar-icon">📚</span>
        <span>Quản lý sách</span>
    </button>

    <button type="button"
            class="admin-sidebar-link {% if active_tab|default('users') == 'users' %}active{% endif %}"
            onclick="window.location.href='/admin?tab=users'">
        <span class="sidebar-icon">👤</span>
        <span>Quản lý người dùng</span>
    </button>


    <button type="button"
            class="admin-sidebar-link {% if active_tab|default('users') == 'borrow_lookup' %}active{% endif %}"
            onclick="window.location.href='/admin?tab=borrow_lookup'">
        <span class="sidebar-icon">🔍</span>
        <span>Tra cứu lịch sử</span>
    </button>
    <button type="button"
            class="admin-sidebar-link {% if active_tab|default('users') == 'borrow' %}active{% endif %}"
            onclick="window.location.href='/admin?tab=borrow'">
        <span class="sidebar-icon">🔄</span>
        <span>Mượn trả</span>
    </button>

    {% if is_admin %}
    <button type="button"
            class="admin-sidebar-link {% if active_tab|default('users') == 'report' %}active{% endif %}"
            onclick="window.location.href='/admin?tab=report'">
        <span class="sidebar-icon">📊</span>
        <span>Báo cáo</span>
    </button>

    <button type="button"
            class="admin-sidebar-link {% if active_tab|default('users') == 'rules' %}active{% endif %}"
            onclick="window.location.href='/admin?tab=rules'">
        <span class="sidebar-icon">⚖️</span>
        <span>Quy định</span>
    </button>
    {% endif %}

</aside>
